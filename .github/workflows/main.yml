name: Build GasTrack APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
          cache-disabled: true
      - name: Build APK
        run: gradle assembleDebug --stacktrace --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
      - name: Show where is APK
        run: |
          echo "Buscando APK..."
          find . -name "*.apk" || echo "No se encontro"
          ls -R app/build/outputs/ || echo "No existe outputs"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GasTrack-Rocha-APK
          path: app/build/outputs/apk/debug/app-debug.apk
